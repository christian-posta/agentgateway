# yaml-language-server: $schema=../../schema/config.json
binds:
- port: 8080
  listeners:
  - protocol: HTTP
    routes:
    - name: aauth-example
      matches:
      - path:
          pathPrefix: /
      policies:
        aauth:
          # Mode: strict (require signature), optional (validate if present), permissive (never reject)
          mode: strict
          # Policy levels in config remain hwk | jwks | jwt.
          # On the wire, the identified signature scheme is scheme=jwks_uri.
          requiredScheme: jwks
          # Timestamp tolerance in seconds (default: 60)
          timestampTolerance: 60
          # Challenge configuration for jwt scheme
          challenge:
            authServer: "https://auth.example.com"
        # CEL authorization can read the verified AAuth context.
        # This example allows:
        # - identified requests from a specific agent using JWKS discovery
        # - authorized requests from the same agent when an auth+jwt is presented
        authorization:
          rules:
          - 'aauth.agent == "https://trusted-agent.example" && (aauth.scheme == "jwks_uri" || (aauth.scheme == "jwt" && aauth.user != null))'
      backends:
      - host: 127.0.0.1:8081
