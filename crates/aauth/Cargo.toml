[package]
name = "aauth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
http-message-sig = { path = "../http-message-sig" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
